[tox]
envlist = py{310,311,312,313,314}-{linux,macos,windows}
isolated_build = true

[testenv]
install_command = pip install --prefer-binary {opts} {packages}
platform =
    macos: darwin
    linux: linux
    windows: win32
changedir = tests
setenv =
    MPLBACKEND = Agg
passenv =
    CI
    GITHUB_ACTIONS
    CC
    CFLAGS
    LDFLAGS
    DYLD_LIBRARY_PATH
    PATH
    INCLUDE
    LIB
    DISTUTILS_USE_SDK
    MSSdk
extras =
    testing
deps =
    numpy>=2.0.0
    pytest
    pytest-cov
commands =
    # Debug
    python -c "import sys; print('DEBUG: Probando import...'); import adamixture; print('DEBUG: Importacion EXITOSA')"
    pytest -v --color=yes --cov=adamixture --cov-report=xml --import-mode=importlib

